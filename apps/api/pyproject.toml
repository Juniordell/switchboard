[project]
name = "switchboard-api"
version = "0.1.0"
description = "FastAPI application exposing the Switchboard tools and the operations platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "switchboard-core",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    # Already pinned in the workspace for the embeddings call (T2.5).
    # Declared here because TestClient needs it directly.
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard_api"]

[tool.uv.sources]
switchboard-core = { workspace = true }
