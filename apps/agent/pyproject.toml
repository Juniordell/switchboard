[project]
name = "switchboard-agent"
version = "0.1.0"
description = "LiveKit voice agent for the Switchboard front desk"
requires-python = ">=3.12,<3.13"
dependencies = [
    "switchboard-core",
    # Already pinned in the workspace (T2.5). The T4.0 text client posts
    # to the model with it; livekit-agents arrives at T5.1.
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard_agent"]

[tool.uv.sources]
switchboard-core = { workspace = true }
