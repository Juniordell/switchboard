# The dashboard: FastAPI under /api, the built frontend on every other path,
# and the async worker that drains ops.async_jobs. One image, two processes.
#
#     fly deploy --remote-only
#
# `--remote-only` matters here: the builders are Fly's, so this deploys from
# a machine with no working Docker daemon.

app = "switchboard-gulf-breeze"
primary_region = "iad"          # next to the Neon database in us-east-2

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  # Stated rather than inferred from __file__, which depends on how the
  # package was installed. main.py logs which path it actually used.
  SWITCHBOARD_WEB_DIST = "/app/apps/web/dist"

[processes]
  app = "uvicorn switchboard_api.main:app --host 0.0.0.0 --port 8000"
  # The Extractor and the Reviewer. Without this the queue fills and nothing
  # empties it - which is exactly what production looked like before it
  # existed.
  worker = "python -m switchboard_api.async_agents.worker"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]           # the worker takes no HTTP traffic

  [http_service.http_options.response.headers]
    # The dashboard shows real customer names, addresses and balances.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
