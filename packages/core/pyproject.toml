[project]
name = "switchboard-core"
version = "0.1.0"
description = "Shared domain library: records, derived knowledge and tool implementations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "httpx==0.28.1",
    # Already present transitively via livekit-agents; declared because
    # switchboard_core.telemetry imports them directly. Langfuse is an
    # OTLP endpoint, not a dependency - there is no langfuse package here.
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-semantic-conventions==0.65b0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "sqlalchemy==2.0.52",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard_core"]
