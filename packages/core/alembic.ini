# Alembic lives with the models, because packages/core owns the schema.
# Run from packages/core:  uv run alembic upgrade head
#
# The database URL is not set here. env.py reads it from DATABASE_URL through
# switchboard_core.db.session, so there is one place that knows the driver.

[alembic]
script_location = src/switchboard_core/db/migrations
prepend_sys_path = src
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
