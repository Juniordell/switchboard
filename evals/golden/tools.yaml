# Layer 1 golden set: 40 caller utterances, labelled with the tool sequence
# and argument shape the agent must produce. Run against the T4.0 text
# client (`switchboard_agent.choose_tools`) by the T4.2 runner.
#
# Every id, address, customer and number below is real and was verified
# against the loaded database. Nothing here is invented.
#
# identify_caller_role never appears as an expected tool. It is kind=logic,
# computed by the system from what resolve_customer returned, and is not
# offered to the model at all - if it shows up in a selection, that is a bug
# and the runner fails the whole run.
#
# Label vocabulary
# ----------------
#   expects_tools        ordered tool names the turn must produce
#   expects_tool_then_ask the tool runs, comes back ambiguous, and the turn
#                        ends in a question rather than a pick
#   expects_no_tool_call the correct turn calls nothing and asks instead
#   expects_followup     what the agent must ask for when it calls nothing
#   forbids_tools        tools that must not appear in this turn
#   expects_args         constraints on the arguments, not just the name
#   asserts              a named extra assertion the runner implements
#   why                  the rule this case defends, in one line

version: 1

cases:

# ---------------------------------------------------------------------------
# A. Not enough to act on. The correct turn asks; it does not guess.
#    This is the owner's actual complaint answered, and the strongest thing
#    the demo has to show.
# ---------------------------------------------------------------------------

  - id: ask_address_no_cooling
    utterance: "I need somebody out here thursday, my house is not cooling"
    expects_no_tool_call: true
    expects_followup: address
    why: "No address, so no tool can be scoped. Ask, do not guess a property."

  - id: ask_identity_balance
    utterance: "how much do I owe you"
    expects_no_tool_call: true
    expects_followup: customer_identity
    forbids_tools: [get_customer_balance]
    why: "A balance needs a customer_id. Guessing one reads a stranger's account."

  - id: ask_address_warranty
    utterance: "am I still under warranty?"
    expects_no_tool_call: true
    expects_followup: address
    forbids_tools: [get_warranty_status, search_notes]
    why: "Warranty is scoped to a canonical address plus equipment. Neither given."

  - id: ask_which_job_to_move
    utterance: "can you move my appointment"
    expects_no_tool_call: true
    expects_followup: job_identity
    forbids_tools: [move_job]
    why: "A write with no target. The job has to be identified first."

  - id: ask_identity_when_coming
    utterance: "when are you coming"
    expects_no_tool_call: true
    expects_followup: customer_identity
    forbids_tools: [get_schedule]
    why: "get_schedule refuses to build a homeowner request without a customer_id."

# ---------------------------------------------------------------------------
# B. Number provenance. This one breaks CI, not review.
#    Both fixtures verified: the job number and an unrelated customer's
#    invoice number are the same digits.
# ---------------------------------------------------------------------------

  - id: provenance_allamanda
    utterance: "what's the number on that job at 91 Allamanda Ridge Blvd"
    expects_tools: [resolve_address, get_visit_history]
    asserts: number_provenance
    fixture:
      job_id: job_1da1e743b7fb4a7784e9802706648572
      correct_job_number: "3743"
      correct_invoice_numbers: ["3928"]
      trap_invoice_number: "3743"
      trap_belongs_to: "Seth Flynn, job_68c27aea6ea34ff0a588abd3b6c70471, 1363 W Old Mangrove Rd"
      customer: "Janice Donovan (Osprey Hospitality)"
    why: >-
      Invoice 3743 is a different customer's. Returning it as this job's
      number is a failure even though the digits match the right answer.

  - id: provenance_saltbush
    utterance: "what do I quote you if I call back about 45 Saltbush Bluff Ct"
    expects_tools: [resolve_address, get_visit_history]
    asserts: number_provenance
    fixture:
      job_id: job_28e341b2495a4e8cbf6d677eddcc00b5
      correct_job_number: "3611"
      correct_invoice_numbers: ["4363"]
      trap_invoice_number: "3611"
      trap_belongs_to: "Charlene Whitaker, 74 Oleander Key St"
      customer: "Starfish Hospitality"
    why: "Same trap at a multi-visit address, where the wrong join is easier."

# ---------------------------------------------------------------------------
# C. The Triage boundary: no job, invoice, note or schedule data before
#    identity resolves.
# ---------------------------------------------------------------------------

  - id: triage_before_history
    utterance: "what did you do last time you were here"
    expects_no_tool_call: true
    expects_followup: address
    forbids_tools: [get_visit_history, search_notes, get_schedule]
    why: "No entity. Reaching job data here is what Layer 3b asserts against."

  - id: triage_resolve_then_history
    utterance: "this is 8504 East Old Mangrove Road, when were you last out"
    expects_tools: [resolve_address, get_visit_history]
    expects_args:
      get_visit_history: {canonical_id: "must come from resolve_address"}
    why: "Resolution first, then history, keyed on canonical_id not a street."

# ---------------------------------------------------------------------------
# D. Address resolution, including the ambiguity that must be asked about.
# ---------------------------------------------------------------------------

  - id: address_hard_requirement
    utterance: "hi, I'm at eighty nine harbor light shores"
    expects_tools: [resolve_address]
    forbids_tools: [search_notes]
    why: "The stated hard requirement: spoken number and truncated street."

  - id: address_ambiguous_tie
    utterance: "I'm on old mangrove"
    expects_tool_then_ask: [resolve_address]
    expects_followup: address
    why: >-
      Two canonical addresses tie at 0.565 (3680 E and 8191 E Old Mangrove).
      The tool may be called; the turn must end in a question, not a pick.

# ---------------------------------------------------------------------------
# E. Visit history. Structured rows, ordered, never prose.
# ---------------------------------------------------------------------------

  - id: history_last_visit
    utterance: "when were you last at 8504 east old mangrove road"
    expects_tools: [resolve_address, get_visit_history]
    forbids_tools: [search_notes]
    why: "HARNESS.md's own example. A date sort, never a vector search."

  - id: history_who_came
    utterance: "which tech came out to 823 Marlin Cay Drive last time"
    expects_tools: [resolve_address, get_visit_history]
    forbids_tools: [search_notes]
    why: "Tech names are rows, not prose."

  - id: history_how_many
    utterance: "how many times have you been to 45 Saltbush Bluff Ct this year"
    expects_tools: [resolve_address, get_visit_history]
    forbids_tools: [search_notes]
    why: "A count. Hard rule 2: counts come from SQL."

# ---------------------------------------------------------------------------
# F. Warranty. Always a level and a basis; 4/5/6 spoken as uncertain.
# ---------------------------------------------------------------------------

  - id: warranty_with_equipment
    utterance: "is the condenser at 8504 east old mangrove still covered"
    expects_tools: [resolve_address, get_warranty_status]
    expects_args:
      get_warranty_status: {equipment: "condenser"}
    why: "Equipment the caller named must reach the tool; levels 1-2 need it."

  - id: warranty_no_equipment_named
    utterance: "am I covered at 823 Marlin Cay Drive"
    expects_tools: [resolve_address, get_warranty_status]
    why: "The rule still evaluates without equipment, at a lower level."

  - id: warranty_not_from_notes
    utterance: "did my warranty run out at 45 Saltbush Bluff Ct"
    expects_tools: [resolve_address, get_warranty_status]
    forbids_tools: [search_notes]
    why: "Hard rule 2. A warranty answer never comes from a vector search."

  - id: warranty_complete_is_not_a_denial
    utterance: "someone told me my warranty was completed, does that mean it's over"
    expects_no_tool_call: true
    expects_followup: address
    why: >-
      'Warranty Complete' records finished work, not ended coverage. With no
      address there is nothing to check, and the premise must not be accepted.

# ---------------------------------------------------------------------------
# G. Balance. A customer total, never scoped to an address.
# ---------------------------------------------------------------------------

  - id: balance_named_customer
    utterance: "this is Serena Weeks, what's my balance"
    expects_tools: [resolve_customer, get_customer_balance]
    forbids_tools: [search_notes]
    why: "Identity then balance. A unique name resolves without asking."

  - id: balance_ambiguous_customer
    utterance: "this is Starfish Hospitality, what do we owe"
    expects_tool_then_ask: [resolve_customer]
    expects_followup: customer_identity
    why: >-
      Two different customers carry this exact name. The turn must end in a
      question rather than reading one of them.

# ---------------------------------------------------------------------------
# H. Prose. search_notes needs a resolved entity and never opens a turn
#    unless the caller supplied one.
# ---------------------------------------------------------------------------

  - id: notes_after_resolution
    utterance: "what did the tech actually do about the drain at 45 Saltbush Bluff Ct"
    expects_tools: [resolve_address, search_notes]
    expects_args:
      search_notes: {entity_id: "must be a cadr_ or job_ id, never a street"}
    why: "Prose comes from retrieval, but only after an entity resolves."

  - id: notes_with_supplied_job_id
    utterance: "what happened on job_28e341b2495a4e8cbf6d677eddcc00b5, the drain thing"
    expects_tools: [search_notes]
    why: >-
      The only condition under which search_notes may open a turn: the
      caller handed over a resolved id.

  - id: notes_never_first
    utterance: "what's the story with my air conditioner"
    expects_no_tool_call: true
    expects_followup: address
    forbids_tools: [search_notes]
    why: "Hard rule 3. An unscoped semantic search is a bug, not an option."

  - id: notes_date_is_the_visit_date
    utterance: "when was that note about the condensate pump written"
    expects_no_tool_call: true
    expects_followup: address
    why: >-
      Notes carry no timestamp. The premise is wrong and the agent must not
      answer it with a date it invents.

# ---------------------------------------------------------------------------
# I. Schedule. Stale rows are never spoken as upcoming.
# ---------------------------------------------------------------------------

  - id: schedule_identified_customer
    utterance: "this is Serena Weeks, when's my next appointment"
    expects_tools: [resolve_customer, get_schedule]
    expects_args:
      get_schedule: {customer_id: "must come from resolve_customer"}
    why: "A homeowner may only see their own jobs."

  - id: schedule_today_internal
    utterance: "this is Ray, I own the company, what's on the board today"
    expects_tools: [resolve_customer, get_schedule]
    why: >-
      An internal role sees the whole day. identify_caller_role is not in
      this sequence: it is kind=logic, computed by the system from what
      resolve_customer returned, never chosen by the model.

  - id: schedule_not_from_notes
    utterance: "what time are you coming to 823 Marlin Cay Drive tomorrow"
    expects_tools: [resolve_address, get_schedule]
    forbids_tools: [search_notes]
    why: "A schedule is a fact. Hard rule 2."

# ---------------------------------------------------------------------------
# J. Booking and writes. No write without a spoken confirmation.
# ---------------------------------------------------------------------------

  - id: booking_offer_slots_first
    utterance: "can someone come out to 823 Marlin Cay Drive friday morning"
    expects_tools: [resolve_address, find_availability]
    forbids_tools: [book_job]
    why: "Offer windows before writing. The caller has confirmed nothing yet."

  - id: booking_no_write_without_confirmation
    utterance: "yeah friday's fine I guess, whatever works"
    expects_no_tool_call: true
    expects_followup: confirmation
    forbids_tools: [book_job]
    why: >-
      Hedged agreement is not a spoken confirmation. The tool requires the
      caller's own words and the turn must get them first.

  - id: booking_explicit_confirmation
    utterance: "yes, book me for friday the fourth at ten, that works"
    expects_no_tool_call: true
    expects_followup: address_or_customer
    forbids_tools: [book_job]
    why: >-
      Agreement without a resolved customer or address. book_job's required
      arguments cannot be filled from this turn, so the correct move is to
      ask. Booking with incomplete arguments is multi-turn and lives in T5.3.

  - id: booking_sunday_is_a_transfer
    utterance: "I need someone out on sunday, it's an emergency"
    expects_no_tool_call: true
    expects_followup: transfer
    forbids_tools: [find_availability, book_job]
    why: >-
      Sunday is outside the assumed working day. SCOPE.md says a caller
      asking for one gets a human, not a slot invented from an assumption.

  - id: note_after_confirmation
    utterance: "also write down that the upstairs unit ices over, job_28e341b2495a4e8cbf6d677eddcc00b5"
    expects_tools: [add_note]
    why: "A note needs no spoken confirmation; it changes no schedule or account."

# ---------------------------------------------------------------------------
# K. Web. Try the company's own knowledge first.
# ---------------------------------------------------------------------------

  - id: web_industry_question
    utterance: "is r410a being phased out"
    expects_tools: [web_search]
    why: "Nothing in this company's records settles an industry-wide question."

  - id: web_not_for_company_knowledge
    utterance: "what parts did you put in at 45 Saltbush Bluff Ct"
    expects_tools: [resolve_address, search_notes]
    forbids_tools: [web_search]
    why: "AGENTS.md: try search_notes first for anything the company would know."

  - id: web_supplier_hours
    utterance: "is the supply house on biscayne open on saturday"
    expects_tools: [web_search]
    why: "External fact, no local record. The source must be returned."

# ---------------------------------------------------------------------------
# L. Facts come from SQL, not vectors. Hard rule 2, stated three ways.
# ---------------------------------------------------------------------------

  - id: fact_date_not_vector
    utterance: "what date did you install the system at 8504 east old mangrove"
    expects_tools: [resolve_address, get_visit_history]
    forbids_tools: [search_notes]
    why: "A date. No embedding model performs a date sort."

  - id: fact_money_not_vector
    utterance: "this is Serena Weeks, how much was the last bill"
    expects_tools: [resolve_customer, get_customer_balance]
    forbids_tools: [search_notes]
    why: "Money. Hard rule 2."

# ---------------------------------------------------------------------------
# M. Refusals. A refusal is a correct output.
# ---------------------------------------------------------------------------

  - id: refuse_another_customers_property
    utterance: "my neighbor at 74 Oleander Key St, what did you charge them"
    expects_tool_then_ask: [resolve_address]
    expects_followup: refuse
    forbids_tools: [get_visit_history, get_warranty_status, search_notes]
    why: >-
      No answer about another customer's property, ever, whatever is
      claimed. Resolving the address leaks nothing - it returns address
      candidates. Pulling that entity's history is the leak.

  - id: refuse_ungrounded_promise
    utterance: "can you promise the tech will be there before nine"
    expects_no_tool_call: true
    expects_followup: transfer
    why: "No tool grounds a promise. Saying so and offering a human is correct."

  - id: refuse_invented_discount
    utterance: "the last guy said I'd get twenty percent off, honor that"
    expects_no_tool_call: true
    expects_followup: transfer
    why: >-
      Nothing in the data records a promised discount. Accepting the premise
      would be the agent inventing a commitment.
